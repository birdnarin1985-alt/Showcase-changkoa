<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Architectural Blueprint CAD Engine - Showcase Pro</title>
  <style>
    :root {
      --bg: #050b12;
      --panel: #0b1522;
      --panel-border: #162a42;
      --text: #e2eafc;
      --muted: #748da6;
      --theme: #ffb703;
      --laser-amber: #ffb703;
      --laser-cyan: #00f0ff;
      --laser-green: #52b788;
      --phi: 1.618;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 24px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 520px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(11, 21, 34, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--theme);
      color: var(--theme);
      font-weight: bold;
      letter-spacing: 1px;
      font-family: monospace;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .model-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .switch-btn {
      height: 40px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--muted);
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      font-family: monospace;
      cursor: pointer;
      transition: 0.2s;
    }
    .switch-btn.active {
      border-color: var(--theme);
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 12px rgba(255, 183, 3, 0.2);
    }

    /* 3D Viewport: Golden Ratio (Width / 1.618) */
    .cad-viewport {
      width: 100%;
      aspect-ratio: 1.618 / 1;
      background: #03070d;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
      touch-action: none;
    }
    svg#cadStage {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud-stat {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 10px;
      color: var(--theme);
      background: rgba(3, 7, 13, 0.85);
      padding: 4px 8px;
      border-radius: 3px;
      border-left: 2px solid var(--theme);
      pointer-events: none;
      font-family: monospace;
    }

    .viewport-tools {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
    }
    .tool-btn {
      background: rgba(11, 21, 34, 0.85);
      border: 1px solid var(--panel-border);
      color: var(--theme);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-family: monospace;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .tool-btn.active {
      background: var(--theme);
      color: #000;
    }

    .control-panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .color-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .color-btn {
      height: 32px;
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--muted);
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: bold;
      cursor: pointer;
      font-family: monospace;
      transition: 0.2s;
    }
    .color-btn.active {
      border-color: var(--theme);
      color: #fff;
      background: rgba(255,255,255,0.06);
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .slider-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      font-family: monospace;
    }
    .slider-info span.val {
      color: var(--theme);
      font-weight: bold;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 22px;
      background: transparent;
      margin: 0;
      cursor: pointer;
    }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 5px;
      background: #060c14;
      border: 1px solid var(--panel-border);
      border-radius: 3px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: var(--theme);
      box-shadow: 0 0 10px var(--theme);
      cursor: pointer;
      margin-top: -7px;
      border: 2px solid #fff;
    }

    .spec-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 10.5px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-family: monospace;
    }
    .spec-item { color: var(--muted); }
    .spec-item strong { color: var(--text); }
  </style>
</head>
<body>

  <header>
    <div>
      <span class="badge" id="badgeTheme">AMBER CAD</span>
      <strong style="margin-left: 8px; font-size: 13px;">VECTOR ENGINE PRO</strong>
    </div>
    <div style="font-size: 10px; color: var(--muted); font-family: monospace;">GOLDEN RATIO 1:1.618</div>
  </header>

  <div class="app-container">
    
    <div class="model-switch">
      <button class="switch-btn" id="btnModelFeeder" onclick="switchModel('feeder')">⚙️ 1. POULTRY FEEDER</button>
      <button class="switch-btn active" id="btnModelGear" onclick="switchModel('gear')">⚙️ 2. MECHANICAL GEAR</button>
    </div>

    <!-- Viewport พร้อมปุ่ม Export และ Auto-Spin -->
    <div class="cad-viewport" id="viewportTouch">
      <div class="hud-stat" id="hudStat">ROT: 260° | TILT: 59°</div>
      <div class="viewport-tools">
        <button class="tool-btn" id="btnSpin" onclick="toggleSpin()">🔄 AUTO-SPIN</button>
        <button class="tool-btn" onclick="exportSVG()">💾 EXPORT SVG</button>
      </div>
      <svg id="cadStage" viewBox="0 0 600 370"></svg>
    </div>

    <div class="control-panel">
      
      <div class="color-tabs">
        <button class="color-btn" onclick="setColor('#00f0ff', 'CYAN BLUEPRINT', this)">CYAN BLUEPRINT</button>
        <button class="color-btn" onclick="setColor('#52b788', 'BIO GREEN', this)">BIO GREEN</button>
        <button class="color-btn active" onclick="setColor('#ffb703', 'AMBER RADAR', this)">AMBER RADAR</button>
      </div>

      <div class="slider-group">
        <div class="slider-info">
          <span>ORBIT ROTATION (มุมหมุนแกนดิ่ง 360°)</span>
          <span class="val" id="valRot">260°</span>
        </div>
        <input type="range" id="rotSlider" min="0" max="360" value="260" oninput="stopSpin(); updateRender();">
      </div>

      <div class="slider-group">
        <div class="slider-info">
          <span>PERSPECTIVE TILT (มุมก้ม-เงยสายตา)</span>
          <span class="val" id="valTilt">59°</span>
        </div>
        <input type="range" id="tiltSlider" min="10" max="75" value="59" oninput="updateRender()">
      </div>

      <div class="slider-group">
        <div class="slider-info">
          <span>MODEL SCALE (อัตราขยายเรขาคณิต)</span>
          <span class="val" id="valScale">1.14x</span>
        </div>
        <input type="range" id="scaleSlider" min="70" max="130" value="114" oninput="updateRender()">
      </div>

      <div class="slider-group" id="customSliderGroup">
        <div class="slider-info">
          <span id="customSliderLabel">TEETH COUNT (จำนวนฟันเฟือง)</span>
          <span class="val" id="valCustom">21 ซี่</span>
        </div>
        <input type="range" id="customSlider" min="12" max="32" value="21" oninput="updateRender()">
      </div>

    </div>

    <div class="spec-card" id="specCard"></div>

  </div>

  <script>
    let activeModel = 'gear';
    let currentColor = '#ffb703';
    let isSpinning = false;
    let spinAnimId = null;

    function switchModel(m) {
      activeModel = m;
      document.getElementById('btnModelFeeder').classList.toggle('active', m === 'feeder');
      document.getElementById('btnModelGear').classList.toggle('active', m === 'gear');

      const customLabel = document.getElementById('customSliderLabel');
      const customSlider = document.getElementById('customSlider');

      if (m === 'feeder') {
        customLabel.innerText = "HOPPER HEIGHT (ความสูงกรวยบรรจุ)";
        customSlider.min = 120;
        customSlider.max = 230;
        customSlider.value = 180;
      } else {
        customLabel.innerText = "TEETH COUNT (จำนวนฟันเฟือง)";
        customSlider.min = 12;
        customSlider.max = 32;
        customSlider.value = 21;
      }
      updateRender();
    }

    function setColor(hex, label, btn) {
      currentColor = hex;
      document.documentElement.style.setProperty('--theme', hex);
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('badgeTheme').innerText = `${label.toUpperCase()}`;
      updateRender();
    }

    function toggleSpin() {
      isSpinning = !isSpinning;
      document.getElementById('btnSpin').classList.toggle('active', isSpinning);
      if (isSpinning) {
        runSpin();
      } else {
        cancelAnimationFrame(spinAnimId);
      }
    }

    function stopSpin() {
      if (isSpinning) {
        isSpinning = false;
        document.getElementById('btnSpin').classList.remove('active');
        cancelAnimationFrame(spinAnimId);
      }
    }

    function runSpin() {
      if (!isSpinning) return;
      const slider = document.getElementById('rotSlider');
      let val = (parseFloat(slider.value) + 0.6) % 360;
      slider.value = val;
      updateRender();
      spinAnimId = requestAnimationFrame(runSpin);
    }

    function exportSVG() {
      const svg = document.getElementById('cadStage');
      const serializer = new XMLSerializer();
      let source = serializer.serializeToString(svg);
      source = '<?xml version="1.0" standalone="no"?>\r\n' + source;
      const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(source);
      
      const link = document.createElement("a");
      link.href = url;
      link.download = `${activeModel}_blueprint_${Date.now()}.svg`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Touch & Drag on Viewport
    let isTouching = false;
    let startX = 0;
    let startRot = 0;
    const vp = document.getElementById('viewportTouch');

    vp.addEventListener('touchstart', (e) => {
      isTouching = true;
      startX = e.touches[0].clientX;
      startRot = parseFloat(document.getElementById('rotSlider').value);
      stopSpin();
    }, { passive: true });

    vp.addEventListener('touchmove', (e) => {
      if (!isTouching) return;
      const dx = e.touches[0].clientX - startX;
      let newRot = (startRot + dx * 0.8) % 360;
      if (newRot < 0) newRot += 360;
      document.getElementById('rotSlider').value = newRot;
      updateRender();
    }, { passive: true });

    vp.addEventListener('touchend', () => { isTouching = false; });

    function updateRender() {
      const rot = parseFloat(document.getElementById('rotSlider').value);
      const tiltDeg = parseFloat(document.getElementById('tiltSlider').value);
      const scale = parseFloat(document.getElementById('scaleSlider').value) / 100;
      const customVal = parseFloat(document.getElementById('customSlider').value);

      document.getElementById('valRot').innerText = `${Math.round(rot)}°`;
      document.getElementById('valTilt').innerText = `${Math.round(tiltDeg)}°`;
      document.getElementById('valScale').innerText = `${scale.toFixed(2)}x`;
      
      const customDisplay = activeModel === 'feeder' ? `${Math.round(customVal)} mm` : `${Math.round(customVal)} ซี่`;
      document.getElementById('valCustom').innerText = customDisplay;

      document.getElementById('hudStat').innerText = `ROT: ${Math.round(rot)}° | TILT: ${Math.round(tiltDeg)}°`;

      const spec = document.getElementById('specCard');
      if (activeModel === 'feeder') {
        spec.innerHTML = `
          <div class="spec-item">เส้นผ่านศูนย์กลางถาด: <strong>Ø 320 mm</strong></div>
          <div class="spec-item">ปากกรวยบน: <strong>Ø 160 mm</strong></div>
          <div class="spec-item">ช่องจ่ายแรงโน้มถ่วง: <strong>4 ทิศรอบฐาน</strong></div>
          <div class="spec-item">คานหูหิ้ว: <strong>พร้อมสลัก Eyelet</strong></div>
        `;
        renderFeeder(rot, tiltDeg, scale, customVal, currentColor);
      } else {
        spec.innerHTML = `
          <div class="spec-item">พิตช์ไดอะมิเตอร์: <strong>Ø 260 mm</strong></div>
          <div class="spec-item">จำนวนฟันกลึง: <strong>${Math.round(customVal)} ฟัน</strong></div>
          <div class="spec-item">รูสวมเพลาใน: <strong>Ø 50 mm + Keyway</strong></div>
          <div class="spec-item">ก้านล้อสี่แฉก: <strong>Web Spokes x4</strong></div>
        `;
        renderGear(rot, tiltDeg, scale, customVal, currentColor);
      }
    }

    function renderFeeder(rotDeg, tiltDeg, scale, hopperH, color) {
      const svg = document.getElementById('cadStage');
      const cx = 300, cy = 205;
      const rad = (rotDeg * Math.PI) / 180;
      const tilt = Math.sin((tiltDeg * Math.PI) / 180);

      function getPoint(r, angleOffsetDeg, z) {
        const a = rad + (angleOffsetDeg * Math.PI / 180);
        return {
          x: cx + (r * Math.cos(a) * scale),
          y: cy + (r * Math.sin(a) * scale * tilt) - (z * scale)
        };
      }

      function ellipseObj(r, z) {
        return { cx, cy: cy - (z * scale), rx: r * scale, ry: r * scale * tilt };
      }

      const trayR = 155, trayLipH = 35, coneBaseR = 88, coneTopR = 58;
      const pBase = ellipseObj(trayR, 0);
      const pLip = ellipseObj(trayR, trayLipH);
      const cBase = ellipseObj(coneBaseR, trayLipH - 4);
      const cTop = ellipseObj(coneTopR, trayLipH + hopperH);

      let svgHtml = `
        <defs>
          <pattern id="gridShow" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.8"/>
          </pattern>
        </defs>
        <rect width="600" height="370" fill="url(#gridShow)"/>

        <line x1="${cx}" y1="20" x2="${cx}" y2="350" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="4 4"/>
        <line x1="80" y1="${cy}" x2="520" y2="${cy}" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="2 2"/>

        <ellipse cx="${pBase.cx}" cy="${pBase.cy}" rx="${pBase.rx}" ry="${pBase.ry}" fill="none" stroke="${color}" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
        <ellipse cx="${pLip.cx}" cy="${pLip.cy}" rx="${pLip.rx}" ry="${pLip.ry}" fill="rgba(255,255,255,0.02)" stroke="${color}" stroke-width="1.8"/>
        <line x1="${pBase.cx - pBase.rx}" y1="${pBase.cy}" x2="${pLip.cx - pLip.rx}" y2="${pLip.cy}" stroke="${color}" stroke-width="1.6"/>
        <line x1="${pBase.cx + pBase.rx}" y1="${pBase.cy}" x2="${pLip.cx + pLip.rx}" y2="${pLip.cy}" stroke="${color}" stroke-width="1.6"/>

        <ellipse cx="${cBase.cx}" cy="${cBase.cy}" rx="${cBase.rx}" ry="${cBase.ry}" fill="none" stroke="${color}" stroke-width="1.2" stroke-dasharray="4 3"/>
        <ellipse cx="${cTop.cx}" cy="${cTop.cy}" rx="${cTop.rx}" ry="${cTop.ry}" fill="rgba(255,255,255,0.04)" stroke="${color}" stroke-width="1.8"/>

        <line x1="${cBase.cx - cBase.rx - 8}" y1="${cBase.cy + 4}" x2="${cTop.cx - cTop.rx + 6}" y2="${cTop.cy - 6}" stroke="${color}" stroke-width="1.8"/>
        <line x1="${cBase.cx + cBase.rx + 8}" y1="${cBase.cy + 4}" x2="${cTop.cx + cTop.rx - 6}" y2="${cTop.cy - 6}" stroke="${color}" stroke-width="1.8"/>
      `;

      for (let a = 0; a < 360; a += 45) {
        const b = getPoint(coneBaseR, a, trayLipH);
        const t = getPoint(coneTopR, a, trayLipH + hopperH);
        svgHtml += `<line x1="${b.x}" y1="${b.y}" x2="${t.x}" y2="${t.y}" stroke="${color}" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.45"/>`;
      }

      for (let p = 0; p < 360; p += 90) {
        const p1 = getPoint(coneBaseR + 8, p - 18, trayLipH);
        const p2 = getPoint(coneBaseR + 8, p + 18, trayLipH);
        const p3 = getPoint(coneBaseR + 8, p + 18, trayLipH + 22);
        const p4 = getPoint(coneBaseR + 8, p - 18, trayLipH + 22);
        svgHtml += `<polygon points="${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y} ${p4.x},${p4.y}" fill="rgba(0,0,0,0.4)" stroke="${color}" stroke-width="1.4"/>`;
      }

      const h1 = getPoint(coneTopR - 4, 0, trayLipH + hopperH);
      const h2 = getPoint(coneTopR - 4, 180, trayLipH + hopperH);
      const ht1 = getPoint(18, 0, trayLipH + hopperH + 28);
      const ht2 = getPoint(18, 180, trayLipH + hopperH + 28);

      svgHtml += `
        <line x1="${h1.x}" y1="${h1.y}" x2="${ht1.x}" y2="${ht1.y}" stroke="${color}" stroke-width="2.2"/>
        <line x1="${h2.x}" y1="${h2.y}" x2="${ht2.x}" y2="${ht2.y}" stroke="${color}" stroke-width="2.2"/>
        <line x1="${ht1.x - 6}" y1="${ht1.y}" x2="${ht2.x + 6}" y2="${ht2.y}" stroke="${color}" stroke-width="2.6"/>
        <ellipse cx="${cx}" cy="${cy - (trayLipH + hopperH + 34) * scale}" rx="${7 * scale}" ry="${5 * scale * tilt}" fill="none" stroke="${color}" stroke-width="2"/>
        <circle cx="${cx}" cy="${cy - (trayLipH + hopperH + 34) * scale}" r="${2 * scale}" fill="#fff"/>
      `;

      const dimX = pLip.cx + pLip.rx + 24;
      const dimTopY = cy - ((trayLipH + hopperH) * scale);
      svgHtml += `
        <g stroke="${color}" opacity="0.85">
          <line x1="${dimX}" y1="${cy}" x2="${dimX}" y2="${dimTopY}" stroke-width="1.2"/>
          <line x1="${dimX - 6}" y1="${cy}" x2="${dimX + 6}" y2="${cy}" stroke-width="1.2"/>
          <line x1="${dimX - 6}" y1="${dimTopY}" x2="${dimX + 6}" y2="${dimTopY}" stroke-width="1.2"/>
          <text x="${dimX + 8}" y="${(cy + dimTopY)/2 + 4}" fill="${color}" font-size="10.5" font-weight="bold" font-family="monospace">H:${Math.round(hopperH)}mm</text>
        </g>
        <text x="24" y="44" fill="${color}" font-size="11" font-family="monospace">POULTRY FEEDER / WIREFRAME CAD</text>
        <text x="24" y="60" fill="rgba(255,255,255,0.4)" font-size="9" font-family="monospace">CONICAL BODY & GRAVITY DISCHARGE</text>
      `;

      svg.innerHTML = svgHtml;
    }

    function renderGear(rotDeg, tiltDeg, scale, teethCount, color) {
      const svg = document.getElementById('cadStage');
      const cx = 300, cy = 185;
      const rad = (rotDeg * Math.PI) / 180;
      const tilt = Math.sin((tiltDeg * Math.PI) / 180);
      const gearThick = 40;

      function gearPt(r, angleOffsetDeg, z) {
        const a = rad + (angleOffsetDeg * Math.PI / 180);
        return {
          x: cx + (r * Math.cos(a) * scale),
          y: cy + (r * Math.sin(a) * scale * tilt) - (z * scale)
        };
      }

      const rOuter = 145, rPitch = 130, rRoot = 110, rHub = 45, rShaft = 22;
      let topPath = '', botPath = '';
      const totalPoints = teethCount * 4;

      for (let i = 0; i < totalPoints; i++) {
        const step = (360 / totalPoints) * i;
        const mod = i % 4;
        let r = (mod === 1 || mod === 2) ? rOuter : rRoot;

        const ptTop = gearPt(r, step, gearThick / 2);
        const ptBot = gearPt(r, step, -gearThick / 2);

        topPath += `${i === 0 ? 'M' : 'L'} ${ptTop.x},${ptTop.y} `;
        botPath += `${i === 0 ? 'M' : 'L'} ${ptBot.x},${ptBot.y} `;
      }
      topPath += 'Z';
      botPath += 'Z';

      let svgHtml = `
        <defs>
          <pattern id="gridGear" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.8"/>
          </pattern>
        </defs>
        <rect width="600" height="370" fill="url(#gridGear)"/>

        <line x1="${cx}" y1="20" x2="${cx}" y2="350" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="4 4"/>
        <line x1="80" y1="${cy}" x2="520" y2="${cy}" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="2 2"/>

        <ellipse cx="${cx}" cy="${cy - (gearThick/2 * scale)}" rx="${rPitch * scale}" ry="${rPitch * scale * tilt}" 
                 fill="none" stroke="${color}" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

        <path d="${botPath}" fill="rgba(0,0,0,0.5)" stroke="${color}" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.6"/>
      `;

      for (let i = 0; i < totalPoints; i += 2) {
        const step = (360 / totalPoints) * i;
        const mod = i % 4;
        let r = (mod === 1 || mod === 2) ? rOuter : rRoot;
        const ptTop = gearPt(r, step, gearThick / 2);
        const ptBot = gearPt(r, step, -gearThick / 2);
        svgHtml += `<line x1="${ptTop.x}" y1="${ptTop.y}" x2="${ptBot.x}" y2="${ptBot.y}" stroke="${color}" stroke-width="1.4"/>`;
      }

      svgHtml += `
        <path d="${topPath}" fill="rgba(255,255,255,0.03)" stroke="${color}" stroke-width="2.0"/>

        <ellipse cx="${cx}" cy="${cy - (gearThick/2 * scale)}" rx="${rHub * scale}" ry="${rHub * scale * tilt}" 
                 fill="rgba(0,0,0,0.4)" stroke="${color}" stroke-width="1.8"/>

        <ellipse cx="${cx}" cy="${cy - (gearThick/2 * scale)}" rx="${rShaft * scale}" ry="${rShaft * scale * tilt}" 
                 fill="none" stroke="${color}" stroke-width="1.6"/>
        <rect x="${cx - 4 * scale}" y="${cy - (gearThick/2 * scale) - (rShaft + 4) * scale * tilt}" 
              width="${8 * scale}" height="${7 * scale}" fill="${color}" opacity="0.8"/>
      `;

      for (let a = 0; a < 360; a += 90) {
        const sp1 = gearPt(rShaft + 4, a, gearThick / 2);
        const sp2 = gearPt(rHub - 2, a, gearThick / 2);
        const sp3 = gearPt(rHub, a + 15, gearThick / 2);
        const sp4 = gearPt(rRoot - 4, a + 15, gearThick / 2);
        svgHtml += `
          <line x1="${sp1.x}" y1="${sp1.y}" x2="${sp2.x}" y2="${sp2.y}" stroke="${color}" stroke-width="2.2"/>
          <line x1="${sp3.x}" y1="${sp3.y}" x2="${sp4.x}" y2="${sp4.y}" stroke="${color}" stroke-width="2.4" stroke-linecap="round"/>
        `;
      }

      const dimX = cx + (rOuter * scale) + 24;
      svgHtml += `
        <g stroke="${color}" opacity="0.85">
          <line x1="${dimX}" y1="${cy - (gearThick/2 * scale)}" x2="${dimX}" y2="${cy + (gearThick/2 * scale)}" stroke-width="1.2"/>
          <line x1="${dimX - 6}" y1="${cy - (gearThick/2 * scale)}" x2="${dimX + 6}" y2="${cy - (gearThick/2 * scale)}" stroke-width="1.2"/>
          <line x1="${dimX - 6}" y1="${cy + (gearThick/2 * scale)}" x2="${dimX + 6}" y2="${cy + (gearThick/2 * scale)}" stroke-width="1.2"/>
          <text x="${dimX + 8}" y="${cy + 4}" fill="${color}" font-size="10.5" font-weight="bold" font-family="monospace">T:${gearThick}mm</text>
        </g>
        <text x="24" y="44" fill="${color}" font-size="11" font-family="monospace">INVOLUTE SPUR GEAR / MACHINERY CAD</text>
        <text x="24" y="60" fill="rgba(255,255,255,0.4)" font-size="9" font-family="monospace">MODULE 4.0 | PRESSURE ANGLE 20°</text>
      `;

      svg.innerHTML = svgHtml;
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateRender();
    });
  </script>
</body>
</html>
